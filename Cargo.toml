[package]
name = "mirl_values_core"
version = "0.0.0-alpha"
edition = "2024"
repository = "https://github.com/Miner3D-Gamer/mirl_values_core"
license.workspace = true
authors.workspace = true
rust-version.workspace = true
maintenance.workspace = true

[features]
default = ["std"]
std = []
all = [
    "all_codecs",
    "all_enum_extensions",
    "toml",
    "mirl_collections/all",
    "mirl_extensions_core/all",
]
# Compatibility with ffi
c_compatible = [
    "mirl_collections/c_compatible",
    "mirl_extensions_core/c_compatible",
]
# Enables all codecs
all_codecs = [
    "serde",
    "bitcode",
    "wincode",
    "compactly",
    "zerocopy",
    "mirl_collections/all_codecs",
]
all_misc_integrations = ["rkyv", "get_size2", "bevy_reflect"]
# All enum extensions
all_enum_extensions = [
    "strum",
    "enum_ext",
    "mirl_collections/all_enum_extensions",
]
# Codec stuff
serde = [
    "dep:serde",
    "mirl_collections/serde",
    "bitcode?/serde",
    "num-bigfloat/serde",
    "num-bigint/serde",
    "toml?/serde",
]
bitcode = ["dep:bitcode", "mirl_collections/bitcode"]
wincode = ["dep:wincode", "mirl_collections/wincode"]
compactly = ["dep:compactly", "mirl_collections/compactly"]
zerocopy = ["dep:zerocopy", "mirl_collections/zerocopy"]
# Enum extensions
strum = ["dep:strum", "mirl_collections/strum"]
enum_ext = ["dep:enum_ext", "mirl_collections/enum_ext"]
enum_ordinalize = ["dep:enum-ordinalize"]
rkyv = ["dep:rkyv"]
parity_scale_codec = ["dep:parity-scale-codec"]
get_size2 = ["dep:get-size2"]
bevy_reflect = ["dep:bevy_reflect"]
# preserve_entries = ["dep:mirl_collections"]
_checking = ["all"]
# Support
toml = ["dep:toml"]

[dependencies]
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.2", optional = true }
enum_ext = { version = "0.6", optional = true, default-features = false }
mirl_collections = { version = "0.0.0-alpha" }
# lightningcss = { version = "1.0-alpha.71", optional = true }
mirl_macros = { version = "0.0.0-alpha" }
# mirl_extensions = { version = "0.0.0-alpha", features = ["bigint", "bigfloat"] }
mirl_extensions_core = { version = "0.0.0-alpha", features = [
    "bigint",
    "bigfloat",
] }
num-bigfloat = { version = "1.7", default-features = false, features = [
    "std",
    "num-traits",
] }
# For the "dynamic" numbers
num-bigint = "0.5"
num-traits = { version = "0.2.19" }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
# Enum functionality
strum = { version = "0.28", optional = true, default-features = false, features = [
    "derive",
] }
# # Settings# indexmap = { version = "1.0", optional = true }
# Support
toml = { version = "1.1", optional = true }
wincode = { version = "0.6", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }
enum-ordinalize = { version = "4.4.2", optional = true }
rkyv = { version = "0.8", optional = true }
parity-scale-codec = { version = "3.7", optional = true, features = ["derive"] }
get-size2 = { version = "0.11", optional = true, features = ["derive"] }
bevy_reflect = { version = "0.20", optional = true }

# css = ["dep:lightningcss"]
[build-dependencies]
mirl_build_tools = { version = "0.0.0-alpha" }

[lints]
workspace = true
